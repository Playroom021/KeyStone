spring.application.name=keystone

# ===============================
# PostgreSQL
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/keystone_db
spring.datasource.username=keystone
spring.datasource.password=keystone123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

# ===============================
# Flyway
# ===============================

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/keystone_db
spring.flyway.user=keystone
spring.flyway.password=keystone123
spring.flyway.locations=classpath:db/migration

# ===============================
# Server
# ===============================

server.port=6767

# ===============================
# Gmail SMTP
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true